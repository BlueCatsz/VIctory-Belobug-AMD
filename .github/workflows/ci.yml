name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p victory -p victory-gpu -p xtask --no-deps --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy -p victory -p victory-gpu -p xtask --no-deps --all-targets --all-features --locked -- -D warnings

  test-default:
    name: Default tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Victory tests
        run: cargo test -p victory --locked
      - name: Victory-GPU known pipeline tests
        run: cargo test -p victory-gpu --lib --locked -- pipeline::known::tests
      - name: Victory-GPU make pipeline tests
        run: cargo test -p victory-gpu --lib --locked -- pipeline::make::tests
      - name: xtask policy and switch tests
        run: cargo test -p xtask --locked

  test-diagnostics:
    name: Diagnostics tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Victory diagnostics tests
        run: cargo test -p victory --all-features --locked -- --test-threads=1
      - name: Victory-GPU known pipeline diagnostics tests
        run: cargo test -p victory-gpu --lib --all-features --locked -- pipeline::known::tests --test-threads=1
      - name: Victory-GPU make pipeline diagnostics tests
        run: cargo test -p victory-gpu --lib --all-features --locked -- pipeline::make::tests --test-threads=1

  check:
    needs: [clippy, test-default, test-diagnostics]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Require all three jobs to pass
        run: |
          if ('${{ needs.clippy.result }}' -ne 'success' -or
              '${{ needs.test-default.result }}' -ne 'success' -or
              '${{ needs.test-diagnostics.result }}' -ne 'success') {
            exit 1
          }
